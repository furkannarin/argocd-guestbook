apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: apps
spec:
  project: default
  source:
    repoURL: https://github.com/furkannarin/argocd-guestbook.git
    targetRevision: HEAD
    path: app-of-apps/guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true