apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: guestbook-argocd
spec:
  project: default
  source:
    repoURL: undefined
    targetRevision: HEAD
    path: guestbook
  destination:
    server: kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true