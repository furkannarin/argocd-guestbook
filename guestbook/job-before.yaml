apiVersion: batch/v1
kind: Job
metadata:
  name: job-before-resources
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      containers:
      - name: reader
        image: busybox
        command: ["sh", "-c", "echo Job start starting; sleep 10; echo Job before resources finished done"]
      restartPolicy: Never