apiVersion: batch/v1
kind: Job
metadata:
  name: wave-test-job
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      containers:
      - name: reader
        image: busybox
        command: ["sh", "-c", "echo Job takes 20 seconds starting; sleep 20; echo Job finished after 20 seconds done"]
      restartPolicy: Never